<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Controle de Vendas</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201a;--mut:#6b7a72;--br:#e1e7e3;--ac:#0f9d58;--ac2:#e6f6ed;--neg:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211c;--tx:#eaf2ed;--mut:#8fa196;--br:#263129;--ac:#34c77b;--ac2:#18301f;--neg:#ff6b60;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211c;--tx:#eaf2ed;--mut:#8fa196;--br:#263129;--ac:#34c77b;--ac2:#18301f;--neg:#ff6b60;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--br);background:var(--bg);color:var(--tx)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:28px;font-weight:700}
.pos{color:var(--ac)}.neg{color:var(--neg)}
.mut{color:var(--mut);font-size:13px}
button{font:inherit;border:0;border-radius:12px;padding:14px;width:100%;font-weight:600;background:var(--ac);color:#fff;margin-top:14px}
button.sec{background:var(--ac2);color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:18px;margin-top:2px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{width:44px;margin:0;padding:8px}
.day{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--br)}
.day:last-child{border:0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--br);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{margin:0;background:none;color:var(--mut);padding:10px}
.tabs button.on{color:var(--ac);background:var(--ac2)}
.msg{text-align:center;color:var(--mut);font-size:13px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<main>
  <h1>📊 Controle de Vendas</h1>
  <div id="lancar">
    <div class="card">
      <label for="d">Data</label>
      <input id="d" type="date">
      <div class="row">
        <div><label for="v">Nº de vendas</label><input id="v" inputmode="numeric" placeholder="0"></div>
        <div><label for="f">Faturamento (R$)</label><input id="f" inputmode="decimal" placeholder="0,00"></div>
        <div><label for="a">Anúncios (R$)</label><input id="a" inputmode="decimal" placeholder="0,00"></div>
        <div><label for="o">Taxas/outros (R$)</label><input id="o" inputmode="decimal" placeholder="0,00"></div>
      </div>
      <div style="margin-top:16px"><span class="mut">Lucro do dia</span><div class="big" id="lucro">R$ 0,00</div></div>
      <button id="save">Salvar o dia</button>
      <button id="del" class="sec" style="display:none">Apagar este dia</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <div id="mes" style="display:none"></div>
</main>
<nav class="tabs">
  <button id="t1" class="on">➕ Lançar</button>
  <button id="t2">📅 Mês</button>
</nav>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var records={},col=null,mode='local',month='';
function today(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function num(s){s=String(s||'').trim().replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isNaN(n)?0:n}
function lucro(r){return r.fat-r.ads-r.out}
month=today().slice(0,7);

function loadLocal(){try{records=JSON.parse(localStorage.getItem('vendas')||'{}')}catch(e){records={}}}
function saveLocal(){try{localStorage.setItem('vendas',JSON.stringify(records))}catch(e){}}

function fillForm(){
  var r=records[$('d').value];
  $('v').value=r?r.vendas:'';
  $('f').value=r?String(r.fat).replace('.',','):'';
  $('a').value=r?String(r.ads).replace('.',','):'';
  $('o').value=r?String(r.out).replace('.',','):'';
  $('del').style.display=r?'block':'none';
  preview();
}
function cur(){return {date:$('d').value,vendas:Math.round(num($('v').value)),fat:num($('f').value),ads:num($('a').value),out:num($('o').value)}}
function preview(){var l=lucro(cur());var e=$('lucro');e.textContent=brl.format(l);e.className='big '+(l>=0?'pos':'neg')}
function say(t){$('msg').textContent=t;setTimeout(function(){$('msg').textContent=''},2500)}

function save(){
  var r=cur();if(!r.date)return;
  records[r.date]=r;
  if(mode==='db'&&col){col.doc(r.date).set(r).then(function(){say('Salvo ✓')},function(){say('Erro ao salvar')})}
  else{saveLocal();say('Salvo ✓')}
  $('del').style.display='block';renderMes();
}
function del(){
  var d=$('d').value;delete records[d];
  if(mode==='db'&&col){col.doc(d).delete()}else saveLocal();
  fillForm();renderMes();say('Apagado');
}

function renderMes(){
  var keys=Object.keys(records).filter(function(k){return k.indexOf(month)===0}).sort().reverse();
  var T={fat:0,ads:0,out:0,vendas:0,l:0};
  keys.forEach(function(k){var r=records[k];T.fat+=r.fat;T.ads+=r.ads;T.out+=r.out;T.vendas+=r.vendas;T.l+=lucro(r)});
  var n=keys.length,p=month.split('-'),
  nome=new Date(+p[0],+p[1]-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  var avgF=n?T.fat/n:0,avgL=n?T.l/n:0,ticket=T.vendas?T.fat/T.vendas:0;
  var h='<div class="nav"><button id="pv" class="sec">‹</button><b style="text-transform:capitalize">'+nome+'</b><button id="nx" class="sec">›</button></div>';
  h+='<div class="grid">'+
  '<div class="kpi"><span class="mut">Faturamento</span><b>'+brl.format(T.fat)+'</b></div>'+
  '<div class="kpi"><span class="mut">Lucro</span><b class="'+(T.l>=0?'pos':'neg')+'">'+brl.format(T.l)+'</b></div>'+
  '<div class="kpi"><span class="mut">Média/dia (fat.)</span><b>'+brl.format(avgF)+'</b></div>'+
  '<div class="kpi"><span class="mut">Média/dia (lucro)</span><b>'+brl.format(avgL)+'</b></div>'+
  '<div class="kpi"><span class="mut">Vendas</span><b>'+T.vendas+'</b></div>'+
  '<div class="kpi"><span class="mut">Ticket médio</span><b>'+brl.format(ticket)+'</b></div>'+
  '<div class="kpi"><span class="mut">Anúncios</span><b>'+brl.format(T.ads)+'</b></div>'+
  '<div class="kpi"><span class="mut">Dias lançados</span><b>'+n+'</b></div></div>';
  h+='<div class="card" style="margin-top:12px">';
  if(!n)h+='<div class="mut">Nenhum lançamento neste mês.</div>';
  keys.forEach(function(k){var r=records[k],l=lucro(r);
    h+='<div class="day" data-d="'+k+'"><div><b>'+k.slice(8)+'/'+k.slice(5,7)+'</b><div class="mut">'+r.vendas+' vendas · '+brl.format(r.fat)+'</div></div><b class="'+(l>=0?'pos':'neg')+'">'+brl.format(l)+'</b></div>'});
  h+='</div>';
  $('mes').innerHTML=h;
  function shift(d){var y=+p[0],m=+p[1]-1+d;var x=new Date(y,m,1);month=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');renderMes()}
  $('pv').onclick=function(){shift(-1)};$('nx').onclick=function(){shift(1)};
  Array.prototype.forEach.call($('mes').querySelectorAll('.day'),function(e){e.onclick=function(){$('d').value=e.getAttribute('data-d');fillForm();tab(1)}});
}
function tab(i){
  $('lancar').style.display=i==1?'block':'none';$('mes').style.display=i==2?'block':'none';
  $('t1').className=i==1?'on':'';$('t2').className=i==2?'on':'';
  if(i==2)renderMes();
}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};
$('d').onchange=fillForm;
['v','f','a','o'].forEach(function(i){$(i).oninput=preview});
$('save').onclick=save;$('del').onclick=del;
$('d').value=today();

loadLocal();fillForm();renderMes();

// Sincronização na nuvem (quando disponível)
try{
  if(window.claude&&claude.use){
    Promise.all([claude.use('db'),claude.use('user')]).then(function(a){
      var db=a[0],user=a[1];if(!db||!user)return;
      return user.id().then(function(id){
        if(!id)return;
        col=db.collection('data/users/'+id);
        var first=true,local=records;
        col.onSnapshot(function(s){
          var m={};s.docs.forEach(function(d){m[d.id]=d.data()});
          if(first){first=false;
            // migra lançamentos locais ainda não enviados
            Object.keys(local).forEach(function(k){if(!m[k]){m[k]=local[k];col.doc(k).set(local[k])}});
            try{localStorage.removeItem('vendas')}catch(e){}
          }
          records=m;mode='db';renderMes();
          if(document.activeElement.tagName!=='INPUT')fillForm();
        },function(){});
      });
    }).catch(function(){});
  }
}catch(e){}
})();
</script>
</body>
</html>
